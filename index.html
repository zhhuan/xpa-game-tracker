<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Xbox Play Anywhere 游戏展示 - 查看所有支持 XPA 功能的游戏">
    <title>Xbox Play Anywhere 游戏展示</title>
    <link rel="stylesheet" href="styles.css?v=20260825-2">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1 class="title">🎮 Xbox Play Anywhere</h1>
                <p class="subtitle">一次购买，在 Xbox 和 Windows 上畅玩</p>
            </div>
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="搜索游戏名称..."
                    aria-label="搜索游戏"
                >
                <button class="search-button" id="searchButton" type="button" aria-label="执行搜索">🔍</button>
                <select id="sortSelect" class="sort-select" aria-label="排序方式">
                    <option value="default">默认排序</option>
                    <option value="date-desc">发行日期（新到旧）</option>
                    <option value="date-asc">发行日期（旧到新）</option>
                    <option value="name">游戏名称</option>
                    <option value="rating">评分（高到低）</option>
                </select>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-value" id="totalGames">0</span>
                    <span class="stat-label">游戏总数</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="displayedGames">0</span>
                    <span class="stat-label">匹配结果</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="lastUpdated">-</span>
                    <span class="stat-label">最后更新</span>
                </div>
            </div>

            <div class="loading-container" id="loadingContainer">
                <div class="loader"></div>
                <p>正在加载游戏数据...</p>
            </div>

            <div class="error-container" id="errorContainer" style="display: none;">
                <div class="error-icon">❌</div>
                <h3>加载失败</h3>
                <p id="errorMessage">无法加载游戏数据</p>
                <button class="retry-button" id="retryButton">重试</button>
            </div>

            <div class="games-grid" id="gamesGrid" aria-live="polite">
                <!-- 游戏卡片将通过 JavaScript 动态生成 -->
            </div>

            <div class="load-more-container" id="loadMoreContainer" hidden>
                <button class="load-more-button" id="loadMoreButton" type="button">显示更多游戏</button>
                <p class="results-progress" id="resultsProgress"></p>
            </div>

            <div class="no-results" id="noResults" style="display: none;">
                <div class="no-results-icon">🔍</div>
                <h3>未找到相关游戏</h3>
                <p>请尝试其他搜索关键词</p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Xbox Play Anywhere 游戏展示 | 数据来源于 <a href="https://www.xbox.com" target="_blank" rel="noopener noreferrer">Xbox 官方网站</a></p>
            <p class="footer-note">仅供个人学习和研究使用</p>
        </div>
    </footer>

    <script src="app.js?v=20260825-1"></script>
</body>
</html>
