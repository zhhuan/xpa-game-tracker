name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Compile Python scripts
        run: python -m compileall -q *.py
      - name: Validate project data
        run: python validate_project.py
      - name: Check required page references
        run: |
          grep -q 'styles.css' index.html
          grep -q 'app.js' index.html
