name: Update XPA data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: update-xpa-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch and compare XPA data
        run: python update_xpa_data.py
      - name: Commit data to update branch
        id: data-update
        run: |
          if git diff --quiet -- data; then
            echo "No data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c codex/data-update
          git add data/games.json data/games.previous.json data/games_with_new_markers.json
          git commit -m "chore(data): update XPA game catalog"
          git fetch origin codex/data-update:refs/remotes/origin/codex/data-update || true
          git push --force-with-lease origin HEAD:codex/data-update
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Create or update data pull request
        id: data-pr
        if: steps.data-update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list \
            --head codex/data-update \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create \
              --head codex/data-update \
              --base main \
              --title "chore(data): update XPA game catalog" \
              --body "Automated daily XPA catalog update. This PR is merged automatically only after the Validate check passes.")"
            pr_number="${pr_url##*/}"
          else
            echo "Updated existing data PR #$pr_number"
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
      - name: Enable auto-merge for data pull request
        if: steps.data-update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.data-pr.outputs.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --merge
      - name: Validate data branch and publish required status
        if: steps.data-update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          status_api="repos/$GITHUB_REPOSITORY/statuses/$sha"

          gh api --method POST "$status_api" \
            -f state=pending \
            -f context=validate \
            -f description="Validate workflow is running"

          gh workflow run ci.yml --ref codex/data-update

          run_id=""
          for attempt in {1..12}; do
            run_id="$(gh run list \
              --workflow ci.yml \
              --branch codex/data-update \
              --event workflow_dispatch \
              --commit "$sha" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$run_id" ]; then
            gh api --method POST "$status_api" \
              -f state=error \
              -f context=validate \
              -f description="Validate workflow did not start"
            exit 1
          fi

          if gh run watch "$run_id" --exit-status --interval 10; then
            gh api --method POST "$status_api" \
              -f state=success \
              -f context=validate \
              -f description="Validate workflow passed" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
          else
            gh api --method POST "$status_api" \
              -f state=failure \
              -f context=validate \
              -f description="Validate workflow failed" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
            exit 1
          fi
